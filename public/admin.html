<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>CTCfix Admin</title>
<link rel="stylesheet" href="site.css">
<style>
.box{max-width:560px;padding:22px;display:flex;flex-direction:column;gap:14px}
.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.f input,.f select{font:500 15px/1.4 var(--sans);color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:10px 11px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:460px){.two{grid-template-columns:1fr}}
.out{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.code{font:600 20px/1.3 var(--mono);letter-spacing:.02em;word-break:break-all;background:var(--accent-soft);padding:12px;border-radius:9px}
.msg{white-space:pre-wrap;font-size:13.5px;background:var(--surface-2);padding:12px;border-radius:9px;margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px}
.err{color:var(--warn);background:var(--warn-soft);padding:10px 12px;border-radius:8px;margin:0;font-size:13.5px}
</style>
</head>
<body>
<div class="wrap">
<header class="nav"><a class="logo" href="index.html"><span class="mark">CF</span><b>CTCfix</b></a><span class="label">Admin · issue access codes</span></header>
<form class="card box" id="f" autocomplete="off">
  <label class="f">Admin key<input id="key" type="password" required></label>
  <label class="f">Customer business name<input id="cust" required placeholder="e.g. Kaveri Foods Pvt Ltd"></label>
  <label class="f">Customer WhatsApp number (10 digits)<input id="phone" inputmode="numeric" placeholder="98xxxxxxxx"></label>
  <div class="two">
    <label class="f">Plan<select id="plan"><option value="S">SME · ₹399/month</option><option value="C">CA · ₹2,299/month</option></select></label>
    <label class="f">Months paid<select id="months"><option>1</option><option>2</option><option>3</option><option>6</option><option>12</option></select></label>
  </div>
  <button class="btn" type="submit" id="go">Issue code</button>
  <p class="err" id="err" hidden></p>
  <div class="out" id="out" hidden>
    <span class="label">Access code</span>
    <div class="code" id="code"></div>
    <span class="label">Message to send</span>
    <p class="msg" id="msg"></p>
    <div class="row"><button type="button" class="btn ghost" id="copy">Copy message</button><a class="btn" id="wa" target="_blank" rel="noopener">Open WhatsApp chat</a></div>
    <p style="margin:0;font-size:13px;color:var(--muted)">Log the payment and code in your records sheet. Codes can't be looked up later.</p>
  </div>
</form>
</div>
<script>
const $ = (id) => document.getElementById(id);
$("f").addEventListener("submit", async (e) => {
  e.preventDefault(); $("err").hidden = true; $("go").disabled = true;
  try {
    const r = await fetch("/api/issue", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ adminKey: $("key").value, plan: $("plan").value, months: +$("months").value, customer: $("cust").value }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Could not issue a code.");
    const until = new Date(d.validUntil + "T00:00:00").toLocaleDateString("en-IN", { day: "numeric", month: "long", year: "numeric" });
    const msg = `Hi, thank you for choosing CTCfix (${d.plan} plan) for ${$("cust").value}.\n\nYour access code: ${d.code}\nValid until: ${until}\n\nOpen https://ctcfix.in/#letter, paste the code in "Access code" and tap Unlock.\n\nFor help, reply here.`;
    $("code").textContent = d.code; $("msg").textContent = msg; $("out").hidden = false;
    const digits = $("phone").value.replace(/\D/g, "").slice(-10);
    $("wa").href = `https://wa.me/${digits.length === 10 ? "91" + digits : ""}?text=${encodeURIComponent(msg)}`;
  } catch (err) { $("err").textContent = err.message; $("err").hidden = false; }
  finally { $("go").disabled = false; }
});
$("copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText($("msg").textContent); $("copy").textContent = "Copied"; }
  catch { $("copy").textContent = "Select and copy manually"; }
  setTimeout(() => ($("copy").textContent = "Copy message"), 2000);
});
</script>
</body>
</html>
